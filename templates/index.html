
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Image Upload</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }


        h1 {
            margin-bottom: 20px;
        }


        #uploadForm {
            margin-bottom: 20px;
        }


        #searchForm {
            margin-bottom: 30px;
        }


        #searchInput {
            padding: 8px;
            width: 250px;
        }


        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }


        .image-card {
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
        }


        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }


        .image-card p {
            word-break: break-word;
        }


        button {
            padding: 8px 15px;
            cursor: pointer;
        }


        .delete-btn {
            margin-top: 10px;
            width: 100%;
        }

    </style>

</head>


<body>

    <h1>Upload Image</h1>


    <!-- ==========================
         UPLOAD FORM
    =========================== -->

    <form id="uploadForm">

        <input
            type="file"
            id="imageInput"
            name="image"
            accept="image/png, image/jpeg"
            required
        >

        <button type="submit">
            Upload
        </button>

    </form>


    <!-- ==========================
         SEARCH FORM
    =========================== -->

    <form id="searchForm">

        <input
            type="text"
            id="searchInput"
            placeholder="Search image name..."
        >

        <button type="submit">
            Search
        </button>

        <button
            type="button"
            id="showAllButton"
        >
            Show All
        </button>

    </form>


    <h2>Gallery</h2>


    <div id="gallery"></div>


    <script>


        // ==========================
        // GET HTML ELEMENTS
        // ==========================

        const uploadForm =
            document.getElementById("uploadForm");

        const imageInput =
            document.getElementById("imageInput");

        const searchForm =
            document.getElementById("searchForm");

        const searchInput =
            document.getElementById("searchInput");

        const showAllButton =
            document.getElementById("showAllButton");

        const gallery =
            document.getElementById("gallery");

        const filePath = "../static/uploads/"    


        // ==========================
        // UPLOAD IMAGE
        // ==========================

        uploadForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const file =
                    imageInput.files[0];


                if (!file) {

                    alert(
                        "Please select an image."
                    );

                    return;
                }


                // Create FormData
                const formData =
                    new FormData();


                formData.append(
                    "image",
                    file
                );


                try {

                    const response =
                        await fetch(
                            "/images",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    // Check response
                    if (!response.ok) {

                        alert(
                            data.error ||
                            "Upload failed."
                        );

                        return;
                    }


                    // ==========================
                    // UPLOAD SUCCESS
                    // No success alert
                    // ==========================

                    // Clear file input
                    imageInput.value = "";


                    // Refresh gallery
                    await loadImages();


                } catch (error) {

                    console.error(
                        "Upload error:",
                        error
                    );


                    alert(
                        "Upload failed. " +
                        "Make sure the Flask server is running."
                    );

                }

            }
        );


        // ==========================
        // LOAD ALL IMAGES
        // ==========================

        async function loadImages() {

            try {

                const response =
                    await fetch("/images");


                if (!response.ok) {

                    throw new Error(
                        "Failed to load images: " +
                        response.status
                    );

                }


                const images =
                    await response.json();


                // Display images
                displayImages(images);


            } catch (error) {

                console.error(
                    "Gallery error:",
                    error
                );


                gallery.innerHTML =
                    "<p>Unable to load images.</p>";

            }

        }


        // ==========================
        // DISPLAY IMAGES
        // ==========================

        function displayImages(images) {

            // Clear gallery
            gallery.innerHTML = "";


            // No images
            if (Object.keys(images).length === 0) {

                gallery.innerHTML =
                    "<p>No images found.</p>";

                return;
            }


            // Display images
            Object.values(images).forEach(function (image) {


                const card =
                    document.createElement("div");


                card.className =
                    "image-card";


                // Image
                const img =
                    document.createElement("img");


                img.src = `${filePath}` + image.filename;


                img.alt =
                    image.filename;


                // Title
                const title =
                    document.createElement("p");


                title.textContent =
                    image.filename.split(".")[0];


                // Delete button
                const deleteButton =
                    document.createElement("button");


                deleteButton.textContent =
                    "Delete";


                deleteButton.className =
                    "delete-btn";


                // Delete button click
                deleteButton.addEventListener(
                    "click",
                    function () {

                        deleteImage(
                            image.filename
                        );

                    }
                );


                // Add elements
                card.appendChild(title);
                card.appendChild(img);
                card.appendChild(
                    deleteButton
                );


                // Add card
                gallery.appendChild(card);

            });

        }


        // ==========================
        // SEARCH IMAGE
        // ==========================

        searchForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const searchName =
                    searchInput.value.trim();


                // Check search input
                if (!searchName) {

                    alert(
                        "Please enter an image name."
                    );

                    return;
                }


                try {

                    const response =
                        await fetch(
                            `/images/search?name=${encodeURIComponent(searchName)}`
                        );


                    const data =
                        await response.json();


                    // Check response
                    if (!response.ok) {

                        alert(
                            data.error ||
                            "Search failed."
                        );

                        return;
                    }


                    // Display search results
                    displayImages(data);


                } catch (error) {

                    console.error(
                        "Search error:",
                        error
                    );


                    gallery.innerHTML =
                        "<p>Unable to search images.</p>";

                }

            }
        );


        // ==========================
        // SHOW ALL IMAGES
        // ==========================

        showAllButton.addEventListener(
            "click",
            async function () {

                searchInput.value = "";

                await loadImages();

            }
        );


        // ==========================
        // DELETE IMAGE
        // ==========================

        async function deleteImage(filename) {


            // Confirmation is still kept
            const confirmDelete =
                confirm(
                    "Are you sure you want to delete " +
                    filename +
                    "?"
                );


            if (!confirmDelete) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `/images/${encodeURIComponent(filename)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                // Check response
                if (!response.ok) {

                    alert(
                        data.error ||
                        "Unable to delete image."
                    );

                    return;
                }


                // ==========================
                // DELETE SUCCESS
                // No success alert
                // ==========================


                // Refresh gallery
                await loadImages();


            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Delete failed. " +
                    "Make sure the Flask server is running."
                );

            }

        }


        // ==========================
        // LOAD GALLERY ON PAGE LOAD
        // ==========================

        loadImages();


    </script>

</body>

</html>
